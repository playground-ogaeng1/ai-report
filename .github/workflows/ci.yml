name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 진행 중인 실행을 취소합니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    # lint·타입체크·테스트·빌드는 **DB 나 외부 서비스에 붙지 않습니다.**
    # 다만 설정 파일이 환경변수를 읽으므로 형식만 맞는 더미 값을 줍니다.
    # (실제 값이 필요한 코드 경로는 요청 시점에만 실행됩니다)
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
      DIRECT_URL: postgresql://user:pass@localhost:5432/postgres
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy

    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 필드에서 읽습니다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # Prisma 클라이언트는 생성물이라 저장소에 없습니다.
      # 이게 없으면 타입체크부터 실패합니다.
      - name: Prisma 클라이언트 생성 + @ppp/db 빌드
        run: pnpm db:build

      - name: Lint
        run: pnpm lint

      - name: 타입체크
        run: pnpm typecheck

      - name: 테스트
        run: pnpm test

      # 앱을 실제로 띄워서 미들웨어·가드 배선을 확인합니다.
      # (단위 테스트로는 "Nest 가 미들웨어를 불러주는지" 를 알 수 없습니다)
      # DB 에 붙지 않는 경로만 두드리므로 더미 연결 문자열로도 돕니다.
      - name: e2e 테스트
        run: pnpm test:e2e

      - name: 프로덕션 빌드
        run: pnpm build
